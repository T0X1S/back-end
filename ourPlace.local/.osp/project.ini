[ourPlace.local]

app_start_command = 
backend_enabled   = off
backend_ip        = 
backend_port      = 
base_url          = {host_scheme}://{host_decoded}{scheme_port}
bind_ip           = auto
environment       = 
http_engine       = Nginx
http_port         = 80
http2_enabled     = on
https_port        = 443
node_engine       = 
php_engine        = PHP-8.4
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host}
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}
